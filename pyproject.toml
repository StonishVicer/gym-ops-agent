[project]
name = "gym-ops-agent"
version = "0.1.0"
description = "Claude API + MCP portfolio project: read-only gym ops MCP server, receipt extraction, and evals over synthetic data."
readme = "README.md"
authors = [
    { name = "StonishVicer", email = "samuelpena8220@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.8.0",
    "faker>=40.39.0",
    "httpx2>=2.13.1,<3",  # the anthropic SDK's own HTTP client (anthropic 1.8.0: httpx2>=2.0.0,<3)
    "mcp>=2.2.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gym_ops"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "perf: wall-clock latency checks (NFR-8); run by `make test`, skipped by `make test-ci`",
    "live: calls the real API through OpenRouter and spends money; run only by `make test-live`",
]

[tool.coverage.run]
source = ["gym_ops"]
branch = true
# NFR-9 excludes the `python -m` shims; they only call main().
omit = ["*/__main__.py"]
